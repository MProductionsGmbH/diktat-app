name: DiktatMac
options:
  bundleIdPrefix: app.diktat
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  # The texts are written in German; English comes from Resources/Localizable.xcstrings.
  developmentLanguage: de
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ONLY_ACTIVE_ARCH: NO
    # A raised version here, pushed to main, starts the release workflow (docs/releasing.md); a new
    # build of the same version starts it too as long as that version has no release yet.
    MARKETING_VERSION: "0.1.9"
    CURRENT_PROJECT_VERSION: "10"
    # In-app updates (Sparkle) run when the feed and the key are set: the app reads the appcast of
    # the newest release (each release carries one, see docs/releasing.md) and checks its
    # signature against the public key. Forks use the appcast and key of their own releases.
    SPARKLE_FEED_URL: "https://github.com/MProductionsGmbH/diktat-app/releases/latest/download/appcast.xml"
    # Name in Finder and the Dock; a design preview builds as "Diktat Vorschau".
    APP_DISPLAY_NAME: Diktat
    SPARKLE_PUBLIC_ED_KEY: "3A2c4TYX0N3g2bae0R6e+8VglQdlDXaPafvtcnBpuMA="

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.8.1
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    exactVersion: 0.18.0
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.17.4
  # Local language models (MLX, Apple Silicon only). mlx-swift and swift-transformers
  # are pinned to the versions mlx-swift-lm and WhisperKit already resolve, so they add
  # no second copy; they are listed to import MLX (memory limits) and Tokenizers.
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.32.3
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.32.3
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers.git
    exactVersion: 1.1.9

targets:
  DiktatMac:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Features
      - path: Services
      - path: Views
      # Shared with the iOS app: AI providers, on-device rewriting, mode prompts.
      - path: ../DiktatShared
      - path: Resources
        buildPhase: resources
        excludes:
          - AppIcon.icns
          - Info.plist
          - DiktatMac.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.diktat.mac
        PRODUCT_NAME: Diktat
        INFOPLIST_FILE: Resources/Info.plist
        INFOPLIST_KEY_CFBundleShortVersionString: $(MARKETING_VERSION)
        INFOPLIST_KEY_CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CODE_SIGN_ENTITLEMENTS: Resources/DiktatMac.entitlements
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_SUFeedURL: $(SPARKLE_FEED_URL)
        INFOPLIST_KEY_SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        INFOPLIST_KEY_SUEnableAutomaticChecks: YES
    dependencies:
      - package: Sparkle
      - package: ArgmaxOSS
        product: WhisperKit
      - package: FluidAudio
        product: FluidAudio
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwift
        product: MLX
      - package: SwiftTransformers
        product: Tokenizers
    scheme:
      testTargets:
        - DiktatMacTests
    entitlements:
      path: Resources/DiktatMac.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true

  DiktatMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      # Pure logic is compiled directly into the test bundle, so tests need no host app.
      - path: Services/TranscriptPostProcessor.swift
      - path: Services/InsertionFitter.swift
      - path: Services/WebsiteHost.swift
      - path: Services/TranscriptParagraphService.swift
      - path: Services/ClipboardPasteService.swift
      - path: ../DiktatShared/Transcription/HallucinationFilter.swift
      - path: ../DiktatShared/Transcription/SpokenEmailAddress.swift
      - path: Services/ShortcutModifiers.swift
      - path: ../DiktatShared/AI/InventedDeadlineFilter.swift
      - path: ../DiktatShared/AI/DecisionTodoFilter.swift
      - path: ../DiktatShared/AI/AIClient.swift
      - path: ../DiktatShared/AI/AIProvider.swift
      - path: ../DiktatShared/AI/LocalServerDiscovery.swift
      - path: ../DiktatShared/Meeting/SpeakerAlignment.swift
      - path: ../DiktatShared/Meeting/EchoFilter.swift
      - path: Services/LocalLanguageModel/LocalModelCatalog.swift
      - path: Services/AudioPadding.swift
      - path: ../DiktatShared/Meeting/SpeakerAlignment.swift
      - path: Features/Meeting/WAVRecovery.swift
      - path: Services/LocalLanguageModel/GemmaChatFormat.swift
      - path: Features/Meeting/TextParts.swift
      - path: Services/FocusedFieldReader.swift
      - path: ../DiktatShared/Meeting/ListDisplay.swift
      - path: Services/SpeechCleanup.swift
      - path: Services/StyleContext.swift
      - path: Services/MicrophoneSelection.swift
      - path: Features/Workflows/TranscriptionSettings.swift
      - path: Services/AppLanguage.swift
      - path: Services/AdaptiveLevel.swift
      - path: Services/PillPosition.swift
      - path: Views/VoiceBarMotion.swift
      - path: ../DiktatShared/AI/ModePrompts.swift
      - path: ../DiktatShared/AI/PromptLanguage.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.diktat.mac.tests
        GENERATE_INFOPLIST_FILE: YES
