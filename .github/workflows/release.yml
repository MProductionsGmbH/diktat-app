name: Release

# Push a tag such as v0.1.0 and this builds the app and publishes it as a GitHub release.
# The version in DiktatMac/project.yml must match the tag; raise CURRENT_PROJECT_VERSION for every release.
# The files have fixed names (Diktat.dmg, Diktat.zip), so the link
# https://github.com/MProductionsGmbH/diktat-app/releases/latest/download/Diktat.dmg
# always gives the newest version.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check the tag against the project version
        run: |
          version="${GITHUB_REF_NAME#v}"
          project_version="$(grep -m1 'MARKETING_VERSION' DiktatMac/project.yml | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ "$version" != "$project_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $project_version in project.yml."
            exit 1
          fi

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      # With an Apple Developer ID the app is signed and notarized, and macOS opens it without a
      # warning. Without the secrets below the release is signed ad hoc, as before.
      # Needed: DEVELOPER_ID_CERT_P12 (the certificate as base64), DEVELOPER_ID_CERT_PASSWORD,
      # APPLE_ID, APPLE_TEAM_ID and APPLE_APP_PASSWORD (an app-specific password). See docs/releasing.md.
      - name: Import the signing certificate
        env:
          DEVELOPER_ID_CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          if [ -z "$DEVELOPER_ID_CERT_P12" ]; then
            echo "No signing certificate: the app is signed ad hoc."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$DEVELOPER_ID_CERT_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$DEVELOPER_ID_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity="$(security find-identity -v -p codesigning "$keychain" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.+)".*/\1/')"
          if [ -z "$identity" ]; then
            echo "No Developer ID Application identity in the certificate."
            exit 1
          fi
          echo "DIKTAT_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build
        run: ./build.sh --release

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$DIKTAT_SIGN_IDENTITY" ] || [ -z "$APPLE_ID" ]; then
            echo "Not signed with a Developer ID or no Apple ID: skipping notarization."
            exit 0
          fi
          ditto -c -k --keepParent Diktat.app "$RUNNER_TEMP/notarize.zip"
          result="$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait 2>&1)"
          echo "$result"
          if ! echo "$result" | grep -q "status: Accepted"; then
            echo "Apple did not accept the app. Run 'xcrun notarytool log <id>' with the id above for the reasons."
            exit 1
          fi
          xcrun stapler staple Diktat.app
          spctl --assess --type execute --verbose Diktat.app

      - name: Package
        run: |
          mkdir -p dist/dmg
          cp -R Diktat.app dist/dmg/Diktat.app
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "Diktat" -srcfolder dist/dmg -ov -format UDZO dist/Diktat.dmg
          ditto -c -k --keepParent Diktat.app dist/Diktat.zip
          shasum -a 256 dist/Diktat.dmg dist/Diktat.zip | tee dist/SHA256SUMS.txt

      # Updates inside the app: the zip is signed with the private update key and listed in
      # appcast.xml, which the release carries as well. Without the secret the release still goes
      # out, only without an update entry. See docs/releasing.md.
      - name: Sign the update and write the appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "No SPARKLE_PRIVATE_KEY secret: no update entry for this release."
            exit 0
          fi
          sign_update="$HOME/Library/Caches/diktat-build/derivedData/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update"
          key_file="$RUNNER_TEMP/sparkle-key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$key_file"
          signature="$("$sign_update" --ed-key-file "$key_file" -p dist/Diktat.zip)"
          rm -f "$key_file"
          length="$(stat -f%z dist/Diktat.zip)"
          version="${GITHUB_REF_NAME#v}"
          build="$(grep -m1 'CURRENT_PROJECT_VERSION' DiktatMac/project.yml | sed -E 's/.*"([^"]+)".*/\1/')"
          date_rfc822="$(date -u '+%a, %d %b %Y %H:%M:%S +0000')"
          repo_url="https://github.com/${GITHUB_REPOSITORY}"
          cat > dist/appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschek.org/xmlns/update" xmlns:dc="http://purl.org/dc/elements/1.1/">
            <channel>
              <title>Diktat</title>
              <item>
                <title>Version ${version}</title>
                <pubDate>${date_rfc822}</pubDate>
                <sparkle:version>${build}</sparkle:version>
                <sparkle:shortVersionString>${version}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
                <sparkle:fullReleaseNotesLink>${repo_url}/releases/tag/${GITHUB_REF_NAME}</sparkle:fullReleaseNotesLink>
                <enclosure url="${repo_url}/releases/download/${GITHUB_REF_NAME}/Diktat.zip" sparkle:edSignature="${signature}" length="${length}" type="application/octet-stream"/>
              </item>
            </channel>
          </rss>
          EOF

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(dist/Diktat.dmg dist/Diktat.zip dist/SHA256SUMS.txt)
          if [ -f dist/appcast.xml ]; then
            files+=(dist/appcast.xml)
          fi
          # A normal release, not a pre-release: only then does "releases/latest" point at it.
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --title "Diktat $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
